# 示例文件：不要提交真实 key，实际内容写在 secrets.toml（已被 .gitignore）
# 本地开发放 deploy/.streamlit/secrets.toml
# 云端部署放 Streamlit Cloud → app → 设置 → 秘密

# --- 大模型 ---
DEEPSEEK_API_KEY = "sk-xxxxxxxxxxxxxxxx"

# --- Google 登录（st.login）---
# redirect_uri 必须和部署后的真实地址完全一致，结尾是 /oauth2callback
# cookie_secret 用这条命令生成：python -c "import secrets; print(secrets.token_hex(32))"
[auth]
redirect_uri = "https://job-radar-scs.streamlit.app/oauth2callback"
cookie_secret = "把生成出来的 64 位十六进制串贴这里"
client_id = "xxxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxxx"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
